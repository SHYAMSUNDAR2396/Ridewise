<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (Modified for linear flow - back button) -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-between items-center px-margin-mobile h-16 w-full border-b border-outline-variant">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 -ml-3 text-on-surface hover:bg-surface-container transition-colors rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile font-semibold text-on-surface absolute left-1/2 -translate-x-1/2">Trip Check</h1>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 px-margin-mobile pb-stack-xl flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Summary Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg flex flex-col gap-stack-md">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="directions_bus">directions_bus</span>
</div>
<div class="flex-grow">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Transport Mode</p>
<p class="font-headline-md text-headline-md text-on-surface">Bus Route 42</p>
</div>
</div>
<div class="border-t border-outline-variant pt-stack-md">
<div class="flex flex-col gap-stack-sm relative pl-6">
<!-- Timeline indicators -->
<div class="absolute left-1.5 top-2 bottom-2 w-[2px] bg-outline-variant"></div>
<div class="absolute left-0 top-1.5 w-3.5 h-3.5 rounded-full border-2 border-primary-container bg-surface-container-lowest"></div>
<div class="absolute left-0 bottom-1.5 w-3.5 h-3.5 rounded-full border-2 border-primary-container bg-primary-container"></div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">From</p>
<p class="font-body-md text-body-md text-on-surface">Connaught Place</p>
</div>
<div class="mt-2">
<p class="font-label-sm text-label-sm text-on-surface-variant">To</p>
<p class="font-body-md text-body-md text-on-surface">Hauz Khas Village</p>
</div>
</div>
</div>
</section>
<!-- Duration Display -->
<section class="flex flex-col items-center justify-center py-stack-lg relative">
<div class="flex items-baseline gap-2">
<h2 class="font-display-lg text-display-lg text-on-surface text-[64px] leading-[72px]">18</h2>
<span class="font-headline-md text-headline-md text-on-surface-variant">min</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-stack-xs uppercase tracking-wider text-center">Estimated Duration</p>
<button aria-label="Edit duration" class="absolute right-0 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors border border-outline-variant bg-surface">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
</button>
</section>
<!-- Additional Info / Spacer -->
<div class="flex-grow flex items-center justify-center opacity-60">
