<body class="bg-background text-on-background min-h-screen flex flex-col relative font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->

<button aria-label="Go back" class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container active:scale-95 transition-colors text-primary">

</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile max-w-md mx-auto w-full flex flex-col relative z-10">
<div class="flex flex-col gap-stack-lg mb-stack-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">How are you travelling?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your primary mode of transport to optimize audio delivery.</p>
</div>
<!-- Travel Mode Selection Grid -->
<div class="grid grid-cols-2 gap-gutter-mobile mb-stack-xl" id="travelModeGrid">
<!-- Metro -->
<button class="mode-btn flex flex-col items-center justify-center p-stack-md rounded-xl border border-outline-variant bg-surface hover:bg-surface-container transition-all text-on-surface" data-selected="false">
<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">subway</span>
<span class="font-label-sm text-label-sm">Metro</span>
</button>
<!-- Bus -->
<button class="mode-btn flex flex-col items-center justify-center p-stack-md rounded-xl border border-outline-variant bg-surface hover:bg-surface-container transition-all text-on-surface" data-selected="false">
<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">directions_bus</span>
<span class="font-label-sm text-label-sm">Bus</span>
</button>
<!-- Local Train -->
<button class="mode-btn flex flex-col items-center justify-center p-stack-md rounded-xl border border-outline-variant bg-surface hover:bg-surface-container transition-all text-on-surface" data-selected="false">
<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">train</span>
<span class="font-label-sm text-label-sm">Local train</span>
</button>
<!-- Cab/Car -->
<button class="mode-btn flex flex-col items-center justify-center p-stack-md rounded-xl border border-outline-variant bg-surface hover:bg-surface-container transition-all text-on-surface" data-selected="false">
<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">local_taxi</span>
<span class="font-label-sm text-label-sm">Cab/car</span>
</button>
<!-- Bike -->

<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">pedal_bike</span>

</button>
<!-- Walk -->

<span class="material-symbols-outlined text-4xl mb-stack-sm" style="font-variation-settings: 'FILL' 0;">explore</span>

<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline-variant px-margin-mobile py-stack-md pb-safe">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-surface-variant text-on-surface-variant opacity-50 cursor-not-allowed font-body-lg text-body-lg py-3 rounded-xl transition-colors font-medium" disabled="" id="continueBtn">
                Continue
            </button>
</div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.mode-btn');
            const continueBtn = document.getElementById('continueBtn');
            let selectedButton = null;

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Deselect previous
                    if (selectedButton) {
                        selectedButton.setAttribute('data-selected', 'false');
                        selectedButton.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary-container');
                        selectedButton.classList.add('bg-surface', 'text-on-surface', 'border-outline-variant');
                        const icon = selectedButton.querySelector('.material-symbols-outlined');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    }

                    // Select new
                    selectedButton = btn;
                    selectedButton.setAttribute('data-selected', 'true');
                    selectedButton.classList.remove('bg-surface', 'text-on-surface', 'border-outline-variant');
                    selectedButton.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary-container');
                    const newIcon = selectedButton.querySelector('.material-symbols-outlined');
                    newIcon.style.fontVariationSettings = "'FILL' 1";

                    // Enable continue button
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'hover:text-on-primary-container');
                });
            });
        });
    </script>
