<script>
        // Subtle image scale effect on load to add premium feel
        document.addEventListener('DOMContentLoaded', () => {
            const heroBg = document.getElementById('hero-bg');
            if(heroBg) {
                setTimeout(() => {
                    heroBg.style.transform = 'scale(1)';
                }, 50);
            }
