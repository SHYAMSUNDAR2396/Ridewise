<style>
        /* Smooth transitions for interactive elements */
        .topic-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .topic-card.selected {
            border-color: #2563eb; /* primary-container */
            background-color: #dbe1ff; /* primary-fixed */
        }
        .topic-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .topic-card:not(.selected) .check-icon {
            opacity: 0;
            transform: scale(0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Suppressed TopAppBar & BottomNavBar: Transactional/Onboarding intent -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile py-margin-mobile">
<!-- Top Section: Indicator & Headline -->
<div class="mb-stack-lg">
<!-- Step Indicator -->
<div class="flex items-center justify-between mb-stack-md">
<span class="font-mono-label text-mono-label text-outline uppercase tracking-wider">Step 3 of 4</span>
<span class="font-mono-label text-mono-label text-primary-container">Skip</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden mb-stack-lg">
<div class="h-full bg-primary-container w-3/4 rounded-full transition-all duration-500 ease-out"></div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-stack-sm">
                What sparks your interest?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Select topics to tailor your daily audio briefing. Tap to select multiple.
            </p>
</div>
<!-- Middle Section: Bento Grid of Topics -->
<div class="flex-1 grid grid-cols-2 gap-stack-sm content-start mb-stack-xl" id="topic-grid">
<!-- History Card -->
<button class="topic-card relative flex flex-col items-start p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="history_edu">history_edu</span>
<span class="font-label-sm text-label-sm text-on-surface">History</span>
<span class="check-icon absolute top-stack-md right-stack-md material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Tech Card (Pre-selected) -->
<button class="topic-card selected relative flex flex-col items-start p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="memory">memory</span>
<span class="font-label-sm text-label-sm text-on-surface">Tech</span>
<span class="check-icon absolute top-stack-md right-stack-md material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Careers Card -->
<button class="topic-card relative flex flex-col items-start p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="work">work</span>
<span class="font-label-sm text-label-sm text-on-surface">Careers</span>
<span class="check-icon absolute top-stack-md right-stack-md material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Finance Card -->
<button class="topic-card relative flex flex-col items-start p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="show_chart">show_chart</span>
<span class="font-label-sm text-label-sm text-on-surface">Finance</span>
<span class="check-icon absolute top-stack-md right-stack-md material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- World News Card (Span 2 cols for asymmetrical bento feel) -->
<button class="topic-card col-span-2 relative flex flex-row items-center p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mr-stack-md" data-icon="public">public</span>
<span class="font-label-sm text-label-sm text-on-surface flex-1">World News</span>
<span class="check-icon material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Culture Card -->
<button class="topic-card relative flex flex-col items-start p-stack-md bg-surface-container-lowest border border-surface-variant rounded-xl text-left hover:border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="palette">palette</span>
<span class="font-label-sm text-label-sm text-on-surface">Culture</span>
<span class="check-icon absolute top-stack-md right-stack-md material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
<!-- Bottom Section: Sticky Action Button -->
<div class="mt-auto pt-stack-md pb-4 sticky bottom-0 bg-background bg-opacity-90 backdrop-blur-sm">
<button class="w-full h-12 flex items-center justify-center bg-primary-container text-on-primary font-label-sm text-label-sm rounded-xl hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-sm">
                Continue
            </button>
</div>
</main>
<script>
        // Simple vanilla JS to handle the multi-select toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const topicCards = document.querySelectorAll('.topic-card');
            
            topicCards.forEach(card => {
                card.addEventListener('click', () => {
                    card.classList.toggle('selected');
                    // Add subtle haptic feedback if supported (simulated conceptually)
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                });
            });
        });
    </script>
</body></html>
