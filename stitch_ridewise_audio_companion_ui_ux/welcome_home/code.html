<style>
      body {
        background-color: #f9f9f9;
        -webkit-tap-highlight-color: transparent;
      }
      .input-underlined {
        background: transparent;
        border: none;
        border-bottom: 1px solid #c3c6d7;
        border-radius: 0;
        padding: 12px 0;
        width: 100%;
        color: #1a1c1c;
      }
      .input-underlined:focus {
        outline: none;
        box-shadow: none;
        border-bottom-color: #2563eb;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md relative pb-[80px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile py-stack-md z-40">
<button class="text-primary hover:bg-surface-container transition-colors p-2 -ml-2 rounded-full flex items-center justify-center active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Ridewise</h1>
<div class="h-8 w-8 rounded-full overflow-hidden border border-outline-variant hover:bg-surface-container transition-colors active:opacity-80 transition-opacity flex-shrink-0 cursor-pointer">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A minimalist professional avatar portrait of a person in a bright, modern light-mode setting. Soft white lighting, subtle background. High contrast legibility." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-boMf_phhCpPih1abPCN6QjOTjGEB_EGq2phWfBALR4mC-FHY9fZKw5yOP22gUAwCyO1dglpf5Teb_AWpBhjF20bKiCLFHNDFPFejhpk3D0a6rFekB4_n7lWaOE3pnf_JnQtN6EmTqx816cyBvXn4HxBVWgkuyE7Dzmy8TZuhL9c6LI4cndohyb0XQKULWx5LGTyuqbn2kMl8k37f8VCjbHIf2z-LEWrXKH81QgO5fN_JfycN4jJpDg"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-stack-lg pb-stack-xl flex flex-col gap-stack-lg">
<!-- Header Text -->
<section class="flex flex-col gap-stack-sm mt-stack-md">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Make every commute worth listening to.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">A complete audio capsule, made for the time you have.</p>
</section>
<!-- Inputs Card -->
<section class="bg-surface-container-lowest border border-surface-variant rounded-xl p-stack-lg flex flex-col gap-stack-md mt-stack-xs relative shadow-sm">
<div class="flex items-center gap-stack-md relative">
<span class="material-symbols-outlined text-outline-variant" data-icon="my_location">my_location</span>
<input class="input-underlined font-body-md text-body-md" placeholder="Start" type="text" value="Current location"/>
</div>
<div class="flex items-center gap-stack-md relative">
<span class="material-symbols-outlined text-outline-variant" data-icon="location_on">location_on</span>
<input class="input-underlined font-body-md text-body-md" placeholder="Destination" type="text"/>
</div>
<!-- Decorative connecting line -->
<div class="absolute left-[35px] top-[48px] bottom-[48px] w-[1px] bg-outline-variant border-dashed border-l border-outline-variant opacity-50 hidden sm:block"></div>
</section>
<!-- Recent Routes -->
<section class="flex flex-col gap-stack-md mt-stack-sm">
<h3 class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Recent routes</h3>
<div class="flex flex-col border border-surface-variant rounded-xl bg-surface-container-lowest overflow-hidden shadow-sm">
<button class="flex items-center gap-stack-md p-stack-md border-b border-surface-variant hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-outline group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined" data-icon="route">route</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-lg leading-tight">Rajiv Chowk to Noida Sector 18</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">~45 mins • Metro audio capsule</span>
</div>
</button>
<button class="flex items-center gap-stack-md p-stack-md hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-outline group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined" data-icon="route">route</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-lg leading-tight">Churchgate to Andheri</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">~55 mins • Local train focus</span>
</div>
</button>
</div>
</section>
<!-- Push content to top -->
<div class="flex-grow"></div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm rounded-xl py-4 flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all mt-stack-md shadow-sm">
            Plan my ride
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe border-t border-outline-variant bg-surface flex justify-around items-center h-16 md:hidden shadow-[0_-4px_24px_rgba(0,0,0,0.02)]">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low active:scale-95 transition-transform duration-150 h-full w-full px-2">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Library (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform duration-150 h-full w-full px-2">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-label-sm text-label-sm mt-1">Library</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform duration-150 h-full w-full px-2">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
