<style>
        .progress-bar-fill {
            transition: width 0.3s ease-in-out;
        }
        /* Custom radio styling to match Modern Editorial */
        input[type="radio"]:checked + div {
            border-color: #2563EB; /* primary-container */
            background-color: #f3f3f3; /* surface-container-low */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Onboarding context, minimal) -->
<header class="flex items-center justify-between px-margin-mobile h-16 w-full shrink-0">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-mono-label text-mono-label text-outline tracking-widest uppercase">
            Step 2 of 4
        </div>
<div class="w-10 h-10"></div> <!-- Spacer for flex centering -->
</header>
<!-- Progress Bar -->
<div class="w-full px-margin-mobile pb-stack-lg shrink-0">
<div class="h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container progress-bar-fill w-2/4"></div>
</div>
</div>
<!-- Main Content Area -->
<main class="flex-1 px-margin-mobile flex flex-col max-w-lg mx-auto w-full">
<!-- Header Section -->
<div class="mb-stack-xl mt-stack-md text-center">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-stack-sm">
                Who should tell the story?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Select a companion voice for your journey. You can change this later.
            </p>
</div>
<!-- Language Toggle -->
<div class="flex justify-center mb-stack-lg">
<div class="inline-flex bg-surface-container-low rounded-full p-1 border border-surface-variant">
<button class="px-6 py-2 rounded-full font-label-sm text-label-sm bg-surface shadow-sm border border-surface-variant text-on-surface transition-all">
                    English
                </button>
<button class="px-6 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all">
                    Hindi
                </button>
</div>
</div>
<!-- Voice Options (Bento-style list) -->
<div class="space-y-stack-md flex-1">
<!-- Option 1: Aria -->
<label class="block cursor-pointer group relative">
<input checked="" class="peer sr-only" name="voice_selection" type="radio" value="aria"/>
<div class="p-5 rounded-xl border border-outline-variant bg-surface transition-all duration-200 hover:border-primary peer-checked:border-[2px] peer-checked:border-primary-container peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-fixed">record_voice_over</span>
</div>
<div>
<div class="font-headline-md text-headline-md-mobile text-on-background mb-1">Aria</div>
<div class="font-label-sm text-label-sm text-outline flex items-center gap-2">
<span>Warm</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>Clear</span>
</div>
</div>
</div>
<button aria-label="Play sample for Aria" class="w-12 h-12 rounded-full border border-surface-variant bg-surface-container-lowest flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Selection indicator -->
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-1.5 h-8 bg-primary-container rounded-r-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</label>
<!-- Option 2: Ishaan -->
<label class="block cursor-pointer group relative">
<input class="peer sr-only" name="voice_selection" type="radio" value="ishaan"/>
<div class="p-5 rounded-xl border border-outline-variant bg-surface transition-all duration-200 hover:border-primary peer-checked:border-[2px] peer-checked:border-primary-container peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-fixed">graphic_eq</span>
</div>
<div>
<div class="font-headline-md text-headline-md-mobile text-on-background mb-1">Ishaan</div>
<div class="font-label-sm text-label-sm text-outline flex items-center gap-2">
<span>Deep</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>Authoritative</span>
</div>
</div>
</div>
<button aria-label="Play sample for Ishaan" class="w-12 h-12 rounded-full border border-surface-variant bg-surface-container-lowest flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-1.5 h-8 bg-primary-container rounded-r-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</label>
<!-- Option 3: Zara -->
<label class="block cursor-pointer group relative">
<input class="peer sr-only" name="voice_selection" type="radio" value="zara"/>
<div class="p-5 rounded-xl border border-outline-variant bg-surface transition-all duration-200 hover:border-primary peer-checked:border-[2px] peer-checked:border-primary-container peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">mic_external_on</span>
</div>
<div>
<div class="font-headline-md text-headline-md-mobile text-on-background mb-1">Zara</div>
<div class="font-label-sm text-label-sm text-outline flex items-center gap-2">
<span>Energetic</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>Upbeat</span>
</div>
</div>
</div>
<button aria-label="Play sample for Zara" class="w-12 h-12 rounded-full border border-surface-variant bg-surface-container-lowest flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-1.5 h-8 bg-primary-container rounded-r-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</label>
</div>
</main>
<!-- Bottom Action Area -->
<div class="px-margin-mobile py-stack-lg bg-background w-full max-w-lg mx-auto pb-safe">
<button class="w-full bg-primary-container text-on-primary font-body-lg text-body-lg py-4 rounded-xl shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center gap-2">
            Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Minimal script for play button toggle -->
<script>
        document.querySelectorAll('button[aria-label^="Play sample"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent radio selection when clicking play
                e.stopPropagation();
                const icon = btn.querySelector('.material-symbols-outlined');
                if (icon.textContent === 'play_arrow') {
                    // Reset all other buttons
                    document.querySelectorAll('button[aria-label^="Play sample"] .material-symbols-outlined').forEach(i => {
                        i.textContent = 'play_arrow';
                        i.style.fontVariationSettings = "'FILL' 1";
                    });
                    icon.textContent = 'pause';
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    icon.textContent = 'play_arrow';
                    icon.style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
    </script>
</body></html>
