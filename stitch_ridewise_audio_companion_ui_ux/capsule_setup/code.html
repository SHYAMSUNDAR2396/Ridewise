<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Capsule Setup - Ridewise</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e4e2e1",
                        "on-secondary-fixed-variant": "#92002a",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-container": "#6e6d6d",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#434655",
                        "inverse-surface": "#2f3131",
                        "on-error": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed-dim": "#c8c6c6",
                        "secondary-fixed": "#ffdadb",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f3f3f3",
                        "inverse-on-surface": "#f0f1f1",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dadada",
                        "secondary-container": "#dc2c4f",
                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#ffb2b7",
                        "on-primary-container": "#eeefff",
                        "background": "#f9f9f9",
                        "surface-bright": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "surface-container-high": "#e8e8e8",
                        "secondary": "#b90538",
                        "surface": "#f9f9f9",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#f3f0ef",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#737686",
                        "on-secondary-container": "#fffbff",
                        "surface-container": "#eeeeee",
                        "primary-fixed": "#dbe1ff",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed": "#40000d",
                        "surface-variant": "#e2e2e2",
                        "primary-container": "#2563eb",
                        "tertiary": "#555555",
                        "primary": "#004ac6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-xs": "4px",
                        "stack-lg": "24px",
                        "margin-mobile": "24px",
                        "stack-sm": "8px",
                        "stack-xl": "48px",
                        "stack-md": "16px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Newsreader"],
                        "mono-label": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-md": ["Newsreader"],
                        "display-lg-mobile": ["Newsreader"],
                        "label-sm": ["Manrope"],
                        "body-md": ["Manrope"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "mono-label": ["12px", { "lineHeight": "14px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chip-selected {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .style-card-selected {
            border-color: #2563eb;
            background-color: #f0f7ff;
        }
        .loading-overlay {
            backdrop-filter: blur(4px);
        }
        .pulse-dot {
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md antialiased pb-32">
<header class="fixed top-0 w-full z-40 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full">
<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container active:scale-95 transition-transform p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display-lg-mobile text-display-lg-mobile font-semibold text-on-surface">Ridewise</div>
<div class="w-10"></div>
</header>
<main class="px-margin-mobile pt-24 max-w-2xl mx-auto space-y-stack-xl">
<section>
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-lg">What do you want to hear about?</h1>
<div class="flex flex-wrap gap-3 mb-stack-lg" id="topic-chips">
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors" data-topic="India and the world">India and the world</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors chip-selected" data-topic="Careers">Careers</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors" data-topic="Personal finance">Personal finance</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors" data-topic="Technology">Technology</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors" data-topic="History">History</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container transition-colors" data-topic="Language">Language</button>
</div>
<div class="relative">
<input class="w-full bg-transparent border-b border-outline-variant py-3 focus:outline-none focus:border-primary-container transition-colors placeholder-on-surface-variant font-body-md text-body-md" id="custom-topic" placeholder="Or type your own topic..." type="text"/>
</div>
</section>
<section>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-stack-md">Listening Style</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="p-6 rounded-xl border border-outline-variant bg-surface cursor-pointer style-card-selected transition-colors" id="style-quick">
<span class="material-symbols-outlined text-primary-container mb-3" data-icon="bolt">bolt</span>
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface mb-1">Quick overview</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Key highlights and summaries. Perfect for short commutes.</p>
</div>
<div class="p-6 rounded-xl border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container transition-colors" id="style-deep">
<span class="material-symbols-outlined text-on-surface-variant mb-3" data-icon="school">school</span>
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface mb-1">Learn deeply</h3>
<p class="font-body-md text-body-md text-on-surface-variant">In-depth analysis and context. Ideal for longer journeys.</p>
</div>
</div>
</section>
<section>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-stack-md">Language</h2>
<div class="flex p-1 bg-surface-container rounded-xl w-full max-w-sm">
<button class="flex-1 py-2 text-center rounded-lg bg-surface shadow-sm font-label-sm text-label-sm text-on-surface">English</button>
<button class="flex-1 py-2 text-center rounded-lg opacity-50 cursor-not-allowed font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-1" disabled="">
                    Hindi
                    <span class="text-[10px] bg-surface-variant px-1.5 py-0.5 rounded text-on-surface-variant">Soon</span>
</button>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent z-40">
<button class="w-full max-w-2xl mx-auto block bg-primary-container text-on-primary py-4 rounded-xl font-label-sm text-label-sm text-center shadow-lg active:scale-[0.98] transition-transform" id="generate-btn">
            Generate my capsule
        </button>
</div>
<div class="fixed inset-0 z-50 bg-background/80 loading-overlay hidden flex-col items-center justify-center" id="loading-state">
<div class="flex gap-2 mb-stack-md text-secondary-container">
<div class="w-3 h-3 rounded-full bg-secondary-container pulse-dot" style="animation-delay: 0s;"></div>
<div class="w-3 h-3 rounded-full bg-secondary-container pulse-dot" style="animation-delay: 0.2s;"></div>
<div class="w-3 h-3 rounded-full bg-secondary-container pulse-dot" style="animation-delay: 0.4s;"></div>
</div>
<p class="font-headline-md text-headline-md text-on-surface">Preparing your capsule...</p>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('#topic-chips button');
            const customInput = document.getElementById('custom-topic');
            const styleCards = [document.getElementById('style-quick'), document.getElementById('style-deep')];
            const generateBtn = document.getElementById('generate-btn');
            const loadingState = document.getElementById('loading-state');

            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => {
                        c.classList.remove('chip-selected', 'bg-primary-container', 'text-white', 'border-primary-container');
                        c.classList.add('border-outline-variant', 'text-on-surface');
                    });
                    chip.classList.add('chip-selected', 'bg-primary-container', 'text-white', 'border-primary-container');
                    chip.classList.remove('border-outline-variant', 'text-on-surface');
                    customInput.value = '';
                });
            });

            customInput.addEventListener('input', () => {
                if (customInput.value.trim() !== '') {
                    chips.forEach(c => {
                        c.classList.remove('chip-selected', 'bg-primary-container', 'text-white', 'border-primary-container');
                        c.classList.add('border-outline-variant', 'text-on-surface');
                    });
                }
            });

            styleCards.forEach(card => {
                card.addEventListener('click', () => {
                    styleCards.forEach(c => {
                        c.classList.remove('style-card-selected', 'bg-blue-50');
                        c.classList.add('hover:bg-surface-container');
                        const icon = c.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-primary-container');
                        icon.classList.add('text-on-surface-variant');
                    });
                    card.classList.add('style-card-selected', 'bg-blue-50');
                    card.classList.remove('hover:bg-surface-container');
                    const icon = card.querySelector('.material-symbols-outlined');
                    icon.classList.add('text-primary-container');
                    icon.classList.remove('text-on-surface-variant');
                });
            });

            generateBtn.addEventListener('click', () => {
                loadingState.classList.remove('hidden');
                loadingState.classList.add('flex');
                setTimeout(() => {
                    loadingState.classList.add('hidden');
                    loadingState.classList.remove('flex');
                }, 3000);
            });
        });
    </script>
</body></html>
